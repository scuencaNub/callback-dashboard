# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "BPAC-CRT-callbacks"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
#resolve_s3 = true
s3_bucket = "bpac-crt-callback-bucket"
#s3_bucket = "bpac-prd-callback-bucket"

parameter_overrides = "DynamoDBTableName=\"BPAC-CRT-bppr-amazon-connect-extensions-TableCallsInSystem-VBHP7ZSGIYO8\" HolidayCalendarTableName=\"BPAC-CRT-bppr-amazon-connect-extensions-TableHolidayCalendar-11K8KU4UR3GYA\" QueueConfigurationTableName=\"BPAC-CRT-bppr-amazon-connect-extensions-TableQueueConfiguration-1XWR70G4CGBKS\" DynamoDBRegion=\"us-east-1\" DynamoDBUri=\"\" CallbackConfigurationParameterName=\"/bppr-amazon-connect-extensions/CRT/callback-configuration\" CognitoUserPoolId=\"us-east-1_LCAVcYQx7\" UserAclTableName=\"BPAC-CRT-Callback-UserAcl\" QueueGroupInfoTableName=\"BPAC-CRT-queue-group-info-crt\""

s3_prefix = "callback-endpoints"
region = "us-east-1"
image_repositories = []
stack_name = "BPAC-CRT-callbacks"

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"
# Para desarrollo local, configurar variables de entorno para las Lambdas
# Si usás DynamoDB Local, cambiar DYNAMODB_URI a "http://localhost:8000"
# Si usás DynamoDB real, asegurate de tener credenciales AWS configuradas
env_file = "env.json"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

