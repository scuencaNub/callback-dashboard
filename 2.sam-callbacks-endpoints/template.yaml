        Variables:
          AWS_DYNAMODB_TABLE_NAME: !Ref QueueConfigurationTableName
          AWS_DYNAMODB_REGION: !Ref DynamoDBRegion
          AWS_DYNAMODB_URI: !Ref DynamoDBUri
          ACL_TABLE_NAME: !Ref UserAclTableName
      Policies:
