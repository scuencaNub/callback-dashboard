          ACL_TABLE_NAME: !Ref UserAclTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserAclTableName
        - Statement:
            - Effect: Allow
              Action:
                - ssm:PutParameter
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CallbackConfigurationParameterName}'
      Events:
        UpdateCallbackConfiguration:
          Type: Api
          Properties:
            Path: /callback-configuration
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer
      AutoPublishAlias: live
    
