      AutoPublishAlias: live
    
  CreateReportByDateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: create_report_by_date/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          REPORTS_TABLE_NAME: !Ref CallbackReportsTableName
          REPORTS_QUEUE_URL: !Ref CallbackReportJobsQueue
          DYNAMODB_REGION: !Ref DynamoDBRegion
          DYNAMODB_URI: !Ref DynamoDBUri
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt CallbackReportsTable.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt CallbackReportJobsQueue.Arn
      Events:
        CreateReportByDate:
          Type: Api
          Properties:
            Path: /reports/callbacks/by-date
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        CreateReportByDateOptions:
          Type: Api
          Properties:
            Path: /reports/callbacks/by-date
            Method: options
      AutoPublishAlias: live

  ProcessReportByDateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: process_report_by_date/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 900
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          REPORTS_TABLE_NAME: !Ref CallbackReportsTableName
          DYNAMODB_REGION: !Ref DynamoDBRegion
          DYNAMODB_URI: !Ref DynamoDBUri
          ATHENA_DATABASE: !Ref AthenaDatabase
          ATHENA_OUTPUT_BUCKET: !Ref AthenaOutputBucket
          ATHENA_OUTPUT_PREFIX: !Ref AthenaOutputPrefix
          ATHENA_TABLE_NAME: !Ref AthenaTableName
          REPORTS_BUCKET: !Ref CallbackReportsBucket
          REPORTS_PREFIX: "reports/callbacks-by-date/"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CallbackReportsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref CallbackReportsTableName
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${CallbackReportsBucket}"
                - !Sub "arn:aws:s3:::${CallbackReportsBucket}/*"
            - Effect: Allow
              Action:
                - s3:GetBucketLocation
                - s3:ListBucket
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub 'arn:aws:s3:::${AthenaOutputBucket}'
                - !Sub 'arn:aws:s3:::${AthenaOutputBucket}/*'
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:StopQueryExecution
              Resource: "*"
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetTable
                - glue:GetPartitions
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource:
                - !Sub 'arn:aws:s3:::bpac-crt-ctr-analytics-crt'
                - !Sub 'arn:aws:s3:::bpac-crt-ctr-analytics-crt/*'
                - arn:aws:s3:::bpac-crt-nubity-callback-sample-for-ui-testing
                - arn:aws:s3:::bpac-crt-nubity-callback-sample-for-ui-testing/*
                - arn:aws:s3:::bpac-prd-callback-reports-bucket
                - arn:aws:s3:::bpac-prd-callback-reports-bucket/*
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
      Events:
        ProcessReportByDateQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CallbackReportJobsQueue.Arn
            BatchSize: 10
      AutoPublishAlias: live

