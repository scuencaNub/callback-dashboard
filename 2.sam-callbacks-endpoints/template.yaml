      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HolidayCalendarTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UserAclTableName
      Events:
        CreateHolidayCalendar:
          Type: Api
          Properties:
            Path: /holiday-calendars
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        CreateHolidayCalendarOptions:
          Type: Api
          Properties:
            Path: /holiday-calendars
            Method: options
      AutoPublishAlias: live
    
  UpdateHolidayCalendarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: update_holiday_calendar/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
