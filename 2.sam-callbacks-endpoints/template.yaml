AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sam-get-calls-in-system

  SAM Template for Get Calls In System API
  Provides Lambda function and API Gateway endpoint to retrieve paginated calls in system records

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 120
    MemorySize: 256
    Environment:
      Variables:
        CORS_ALLOWED_ORIGIN: !Ref CorsAllowedOrigin
  Api:
    Auth:
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
          Identity:
            Header: Authorization
            ReauthorizeEvery: 0
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: !Sub "'${CorsAllowedOrigin}'"
      MaxAge: "'3600'"

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - crt
      - prd
    Default: crt
  DynamoDBTableName:
    Type: String
    Description: Name of the DynamoDB table containing calls in system records
  HolidayCalendarTableName:
    Type: String
    Description: Name of the DynamoDB table containing holiday calendar records
  QueueConfigurationTableName:
    Type: String
    Description: Name of the DynamoDB table containing queue configuration records
  QueueOperationHoursTableName:
    Type: String
    Description: Name of the DynamoDB table containing queue operation hours (open/close per day)
    Default: BPAC-PRD-BPPR-ACE-TableQueueOperationHours-1P3EC19D2UXWZ
  CallbackLimitAsap:
    Type: Number
    Description: Max callbacks per 15-min slot for ASAP (matches MAX_CALLBACKS_PER_SLOT in GetEwtValue)
    Default: 120
  CallbackLimitSchedule:
    Type: Number
    Description: Max callbacks per 15-min slot for SCHEDULE (matches the limit in GetSchedulePrompts)
    Default: 20
  CallbackConcurrencyMetricsTableName:
    Type: String
    Description: Name of the DynamoDB table containing callback concurrency metrics records
  UserAclTableName:
    Type: String
    Description: Name of the DynamoDB table containing user ACL (email -> role)
  DynamoDBRegion:
    Type: String
    Description: AWS Region for DynamoDB
    Default: us-east-1
  DynamoDBUri:
    Type: String
    Description: DynamoDB endpoint URI (leave empty for production)
    Default: ""
  CallbackConfigurationParameterName:
    Type: String
    Description: Name of the SSM Parameter containing callback configuration
    Default: /bppr-amazon-connect-extensions/DEV/callback-configuration
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for API authorization
    Default: us-east-1_LCAVcYQx7
  CorsAllowedOrigin:
    Type: String
    Description: Allowed CORS origin (use * for testing/CRT)
    Default: "*"

  AthenaDatabase:
    Type: String
    Description: Athena database name for Connect contacts queries
  AthenaOutputBucket:
    Type: String
    Description: S3 bucket for Athena query results
  AthenaOutputPrefix:
    Type: String
    Description: S3 prefix for Athena query results
  AthenaTableName:
    Type: String
    Description: Athena table name for Connect contacts queries
  CallbackReportsTableName:
    Type: String
    Description: Name of the DynamoDB table for callback reports jobs
  CallbackReportJobsQueueName:
    Type: String
    Description: Name of the SQS queue for callback report jobs
  QueueRegisterStatsTableName:
    Type: String
    Description: Name of the DynamoDB table containing queue register stats (cust_registered, cust_register_pending)
  QueueGroupInfoTableName:
    Type: String
    Description: Name of the DynamoDB table containing queue group info (after_threshold_behavior)
  AniBlockedTableName:
    Type: String
    Description: Name of the DynamoDB table containing blocked ANIs
    Default: BPAC-PRD-ani-blocked
  ActiveContactsInFlowTableName:
    Type: String
    Description: Name of the DynamoDB table containing per-contact callback journey (offered/selected type/outcome)
    Default: ""
  RegistrationIndexTableName:
    Type: String
    Description: Name of the DynamoDB table indexing CallsInSystem by (queue_name, cb_registered_at), kept in sync via DynamoDB Streams
    Default: ""
  QueueAssociationTableName:
    Type: String
    Description: Name of the DynamoDB table mapping queue_arn to queue metadata (QueueAssociation)
    Default: "BPAC-PRD-BPPR-ACE-TableQueueAssociation-1K0NXHD0SXCEP"
  NotAcceptedDetailTableName:
    Type: String
    Description: Name of the DynamoDB table for not-accepted callback detail records
    Default: "BPAC-PRD-Callback-NotAcceptedDetail"

# Conditions:
#   IsProd: !Equals [!Ref Environment, prd]

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: shared_layer/
      CompatibleRuntimes:
        - python3.12

  UserAclTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref UserAclTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # AniBlockedTable is not created by this stack: the table BPAC-PRD-ani-blocked
  # already exists in the account (productive) and is referenced by name via the
  # AniBlockedTableName parameter, same as the other productive tables
  # (CallsInSystem, QueueConfiguration, etc.). Declaring it as a resource here
  # collides with the existing table (ResourceExistenceCheck).

  CallbackReportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref CallbackReportsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: createdByNormalized
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CreatedByCreatedAtIndex
          KeySchema:
            - AttributeName: createdByNormalized
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CallbackReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCallbackReportsAfter7Days
            Status: Enabled
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "http://localhost:3000"
              - "https://d859kntxq6gml.cloudfront.net"
              - "https://d1f2o9mv2do2d5.cloudfront.net"
            AllowedMethods:
              - GET
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - Content-Length
              - Content-Type
            MaxAge: 3000

  CallbackReportJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref CallbackReportJobsQueueName
      VisibilityTimeout: 960

  GetCallsInSystemFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: get_calls_in_system/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          DYNAMODB_REGION: !Ref DynamoDBRegion
          DYNAMODB_URI: !Ref DynamoDBUri
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DynamoDBTableName
      Events:
        GetCallsInSystem:
          Type: Api
          Properties:
            Path: /getCallsInSystem
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        GetCallsInSystemOptions:
          Type: Api
          Properties:
            Path: /getCallsInSystem
            Method: options
      AutoPublishAlias: live
    
  UpdateCallsInSystemFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: update_calls_in_system/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          DYNAMODB_REGION: !Ref DynamoDBRegion
          DYNAMODB_URI: !Ref DynamoDBUri
          ACL_TABLE_NAME: !Ref UserAclTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UserAclTableName
      Events:
        UpdateCallsInSystem:
          Type: Api
          Properties:
            Path: /calls-in-system/{contact_id_inbound}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateCallsInSystemOptions:
          Type: Api
          Properties:
            Path: /calls-in-system/{contact_id_inbound}
            Method: options
      AutoPublishAlias: live
    
  GetHolidayCalendarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_holiday_calendar/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS_DYNAMODB_TABLE_NAME: !Ref HolidayCalendarTableName
          AWS_DYNAMODB_REGION: !Ref DynamoDBRegion
          AWS_DYNAMODB_URI: !Ref DynamoDBUri
      Policies:
