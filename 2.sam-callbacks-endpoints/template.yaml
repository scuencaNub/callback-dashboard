  QueryReportByDate:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: query_report_by_date/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 300
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          ATHENA_DATABASE: !Ref AthenaDatabase
          ATHENA_OUTPUT_BUCKET: !Ref AthenaOutputBucket
          ATHENA_OUTPUT_PREFIX: !Ref AthenaOutputPrefix
          ATHENA_TABLE_NAME: !Ref AthenaTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:StopQueryExecution
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetBucketLocation
                - s3:ListBucket
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub 'arn:aws:s3:::${AthenaOutputBucket}'
                - !Sub 'arn:aws:s3:::${AthenaOutputBucket}/*'
                - arn:aws:s3:::bpac-crt-athena-query-bucket
                - arn:aws:s3:::bpac-crt-athena-query-bucket/*
                - arn:aws:s3:::bpac-prd-callback-reports-bucket
                - arn:aws:s3:::bpac-prd-callback-reports-bucket/*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource:
                - !Sub 'arn:aws:s3:::bpac-crt-ctr-analytics-crt'
                - !Sub 'arn:aws:s3:::bpac-crt-ctr-analytics-crt/*'
                - arn:aws:s3:::bpac-crt-nubity-callback-sample-for-ui-testing
                - arn:aws:s3:::bpac-crt-nubity-callback-sample-for-ui-testing/*
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetTable
                - glue:GetPartitions
              Resource: "*"
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
      Events:
        QueryReportByDate:
          Type: Api
          Properties:
            Path: /report-by-date
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        QueryReportByDateOptions:
          Type: Api
          Properties:
            Path: /report-by-date
            Method: options
      AutoPublishAlias: live
    
