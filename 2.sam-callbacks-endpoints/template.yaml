      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HolidayCalendarTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UserAclTableName
      Events:
        DeleteHolidayCalendar:
          Type: Api
          Properties:
            Path: /holiday-calendars/{date}
            Method: delete
            Auth:
              Authorizer: CognitoAuthorizer
        DeleteHolidayCalendarOptions:
          Type: Api
          Properties:
            Path: /holiday-calendars/{date}
            Method: options
      AutoPublishAlias: live
    
  GetQueueConfigurationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_queue_configuration/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS_DYNAMODB_TABLE_NAME: !Ref QueueConfigurationTableName
