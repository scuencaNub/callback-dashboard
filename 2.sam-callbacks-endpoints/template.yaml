            Auth:
              Authorizer: CognitoAuthorizer
      AutoPublishAlias: live
    
  DeleteHolidayCalendarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: delete_holiday_calendar/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Layers:
